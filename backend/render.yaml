services:
  - type: web
    name: portfolio-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        scope: build,runtime
      - key: ADMIN_EMAIL
        scope: build,runtime
      - key: ADMIN_PASSWORD
        scope: build,runtime
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
